name: chat
description: 野火IM flutter 客户端，支持 Android、iOS、HarmonyOS、Windows、macOS 和 Linux
version: 0.1.1

# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

environment:
  sdk: ">=3.0.0"
  flutter: ">=1.20.0"

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  imclient:
    # When depending on this package from a real application you should use:
    #   rtckit: ^x.y.z
    # See https://dart.dev/tools/pub/dependencies#version-constraints
    # The example app is bundled with the plugin so we use a path dependency on
    # the parent directory to use the current plugin's version.
    path: ../imclient/

  avenginekit:
    # When depending on this package from a real application you should use:
    #   rtckit: ^x.y.z
    # See https://dart.dev/tools/pub/dependencies#version-constraints
    # The example app is bundled with the plugin so we use a path dependency on
    # the parent directory to use the current plugin's version.
    path: ../avenginekit/

  # 通话界面（含最小化悬浮窗）直接使用 RTCVideoRenderer/RTCVideoView
  # 实际解析到 vendor/flutter_webrtc 的本地补丁版，见下方 dependency_overrides
  flutter_webrtc: ^1.5.2

  moment:
    path: ../moment/

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.5
  shared_preferences: ^2.2.0
  fluttertoast: ^9.0.0
  image_picker: ^1.1.2
  # 直接依赖仅为在 Android 上启用系统 Photo Picker(免相册权限、原生多选上限),见 main.dart
  image_picker_android: ^0.8.13
  image_picker_platform_interface: ^2.11.0
  # 本地补丁版(微信式手势:双指焦点缩放、双击定点放大),见 vendor/photo_view/PATCHES.md
  photo_view:
    path: ../vendor/photo_view
  cached_network_image: ^3.2.3
  flutter_cache_manager: ^3.3.2
  flutter_local_notifications: ^17.2.4
  http: ^1.2.1
  event_bus: ^2.0.0
  image: ^4.0.15
  badges: ^3.0.3
  flutter_slidable: ^3.0.0
  intl: ^0.20.2
  file_picker: ^8.0.7
  desktop_drop: ^0.5.0
  # 0.9.0 起 cargokit 才认识 Flutter 3.35 的 com.flutter.gradle.FlutterPlugin，
  # 低版本会静默跳过 Rust 构建，导致 libsuper_native_extensions.so 缺失。
  super_clipboard: ^0.9.1
  cross_file: ^0.3.4+2
  crypto: ^3.0.3
  mime: ^1.0.5
  # Windows平台9.30.0有问题，这里固定为9.28.0
  flutter_sound: 9.28.0
  path_provider: ^2.1.5
  permission_handler: ^11.3.1
  wechat_camera_picker: ^4.2.1
  # 微信式应用内相册多选(Android/iOS;ohos 无 photo_manager 实现,走系统选择器)
  wechat_assets_picker: ^9.4.0
  video_player: ^2.10.0
  url_launcher: ^6.3.0
  # 本地补丁版(Linux 插件销毁时摘掉全局 emission hook 与窗口信号回调,
  # 修子窗口关闭后点击主窗口崩溃),见 vendor/window_manager/PATCHES.md
  window_manager:
    path: ../vendor/window_manager
  desktop_multi_window: ^0.2.0
  tray_manager: ^0.2.4
  menu_base: ^0.1.1
  windows_single_instance: ^0.1.1
  flutter_localization: ^0.3.3
  provider: ^6.1.4
  webview_flutter: ^4.13.0
  dsbridge_flutter: 1.2.0
  # webview_flutter 官方只有 Android/iOS/macOS 三个联邦实现,Linux 上
  # WebViewPlatform.instance 为 null,构造 controller 直接抛断言(工作台整页变红)。
  # 这个包实现的是同一个 webview_flutter_platform_interface,注册后
  # webview_flutter 与 dsbridge 的 API 在 Linux 上照常可用,Dart 侧无需改动。
  #
  # 它的 pubspec 写的是 `implements: webview_all`,不是 webview_flutter,所以属于
  # 非官方用法:Flutter 工具链对某平台只有唯一候选实现时无条件注册它
  # (flutter_tools/lib/src/flutter_plugins.dart 的 _resolveImplementationOfPlugin),
  # 不检查 app-facing 包在不在依赖图里。升级 Flutter 后若工作台在 Linux 上又变红,
  # 先回来看这条。不要改成依赖 webview_all:那个包自带一份同名 WebViewController,
  # 与 dsbridge 的 DWebViewController 不是同一个类型,编译不过。
  #
  # 构建机需要 libwebkit2gtk-4.1-dev,目标机需要 libwebkit2gtk-4.1-0
  # (打 deb 时记得写进 Depends,缺库时是整个 App 起不来,不是工作台不可用)。
  #
  # ⚠️ 这个包的原生 dispose 只 gtk_widget_hide,不销毁 WebView —— 每个
  # WebKitWebView 背后一个常驻 WebKitWebProcess(约 100~200MB),创建了就活到
  # 进程退出。试过打补丁在 dispose 里 g_hash_table_remove 走它的 destroy 流程,
  # 结果 gtk_widget_destroy 会把 update_flutter_view_input_region 算出一个空的
  # 输入区域,整个顶层窗口对鼠标透明(点击穿透到后面的应用、窗口都拖不动,
  # 而拖不动就再也触发不了重算 = 死锁)。故不销毁,改由工作台复用 WebView,
  # 见 WorkspaceTabsViewModel 的 host 池。
  webview_all_linux: ^1.2.1
  # 同一套联邦实现的 Windows 版(WebView2)。与 Linux 那个不同,它是**纹理渲染**
  # (Texture + textureId),网页画进 Flutter 场景里,没有原生浮层那套遮挡/输入区域
  # 问题;它的 widget 卸载也不会销毁 controller,所以工作台"只挂当前页签"的做法
  # 在这边同样成立。
  #
  # 构建机要能访问 dist.nuget.org 与 nuget.org(插件的 CMake 会拉 nuget.exe 以及
  # Microsoft.Web.WebView2 / WIL 两个包);目标机要装 WebView2 Runtime
  # (Win11 自带,Win10 1809+ 需单独安装,装机时要一并部署)。
  #
  # 本地补丁版 1.2.1(上游漏设 AreDefaultScriptDialogsEnabled,WebView2 的
  # ScriptDialogOpening 事件永远不触发,dsbridge 靠拦 prompt() 的 JS→Dart 通道
  # 整条是死的:工作台首页能打开,点里面任何东西都没反应),
  # 见 vendor/webview_all_windows/PATCHES.md
  webview_all_windows:
    path: ../vendor/webview_all_windows

  logger: any
  path: any
  pinyin: ^3.3.0
  flutter_linkify: ^6.0.0

  mobile_scanner: ^6.0.11
  qr_flutter: ^4.1.0
  pointycastle: ^4.0.0
  win32: ^5.15.0
  win32_registry: ^2.1.0

dependency_overrides:
  uuid: ^4.4.2
  # webview_flutter_wkwebview 3.18.0+ 在 iOS 处理 authentication challenge 时存在
  # NSNull -> AuthenticationChallengeResponse 强制转换崩溃（flutter/flutter#162437）。
  # 鸿蒙适配仓库的 3.22.0 同样受影响，临时固定到 pub.dev 原版的 3.17.0。
  webview_flutter_wkwebview: 3.17.0

  # 本地补丁版 1.5.2(修 Linux 子窗口拿不到 FlutterWebRTC.Method channel，
  # PC 端通话跑在独立子窗口里，不打补丁发起通话必失败)，见
  # vendor/flutter_webrtc/PATCHES.md。avenginekit 也依赖 flutter_webrtc，
  # 所以这里用 overrides 而不是直接改上面的 path。
  # 注意：构建 ohos 版本时要把本条注释掉，改用下方 [ohos-begin] 区块里的
  # gitcode 适配版(鸿蒙不涉及桌面多窗口)，否则 dependency_overrides 里
  # flutter_webrtc 出现两次，pub 会报重复 key。
  flutter_webrtc:
    path: ../vendor/flutter_webrtc

